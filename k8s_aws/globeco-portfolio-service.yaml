apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-portfolio-service
  namespace: globeco
  labels:
    app: globeco-portfolio-service
spec:
  {{- if eq .Values.autoscaler "vpa" }}
  replicas: 2
  {{- else }}
  replicas: 1
  {{- end }}

  # A newly-ready pod must remain ready for 10 seconds before
  # the Deployment considers it available.
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: globeco-portfolio-service
  template:
    metadata:
      labels:
        app: globeco-portfolio-service
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MongoDB at globeco-portfolio-service-mongodb:27017..."
              until nc -z globeco-portfolio-service-mongodb 27017; do
                echo "MongoDB not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "MongoDB is reachable."
      containers:
        - name: globeco-portfolio-service
          image: kasbench/globeco-portfolio-service:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Inject the node IP from the Downward API
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MONGODB_URI
              value: "mongodb://globeco-portfolio-service-mongodb:27017"
            - name: OTEL_METRICS_LOGGING_ENABLED
              value: "true"
            - name: ENABLE_METRICS
              value: "true"
            - name: METRICS_DEBUG_LOGGING
              value: "false"
            # Thread Metrics Configuration
            - name: ENABLE_THREAD_METRICS
              value: "true"
            - name: THREAD_METRICS_UPDATE_INTERVAL
              value: "1.0"
            - name: THREAD_METRICS_DEBUG_LOGGING
              value: "false"
            - name: ENABLE_METRICS_MIDDLEWARE
              value: "true"
            # Service Namespace Label
            - name: SERVICE_NAMESPACE
              value: "globeco"
            # OpenTelemetry Metrics Export Configuration
            - name: OTEL_METRICS_EXPORT_INTERVAL_SECONDS
              value: "5"
            - name: OTEL_METRICS_EXPORT_TIMEOUT_SECONDS
              value: "10"
            # OpenTelemetry Configuration
            - name: OTEL_SERVICE_NAME
              value: "globeco-portfolio-service"
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            # Use NODE_IP for daemonset + hostport routing
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "$(NODE_IP):4317"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://$(NODE_IP):4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "http://$(NODE_IP):4318/v1/metrics"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            # Pod information for k8sattributes processor
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOG_LEVEL
              value: "INFO"
            - name: MAX_POOL_SIZE
              value: "50"     # Larger pool for development
            - name: MIN_POOL_SIZE
              value: "10"
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests:
              cpu: "200m"
              memory: "300Mi"
            limits:
              cpu: "200m"
              memory: "300Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 10
            
---
apiVersion: v1
kind: Service
metadata:
  name: globeco-portfolio-service
  namespace: globeco
spec:
  selector:
    app: globeco-portfolio-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP 

{{- if eq .Values.autoscaler "vpa" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-portfolio-service-pdb
  namespace: globeco
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: globeco-portfolio-service
{{- end }}